# Application
spring.application.name=ms-hexarq-spb

# Server
server.port=8080

# Database H2
spring.datasource.url=jdbc:h2:mem:atoscambiaisdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
kafka.topic.order-events=order-events
kafka.consumer.group-id=order-service-group

# Logging
logging.level.com.kraftbrains.mshexarqspb=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
